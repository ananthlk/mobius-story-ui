steps:
  # Build the container image
  # Build context is the repo root (mobius-story-ui dir submitted by deploy.sh)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '$_IMAGE'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: build

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE']
    id: push
    waitFor: ['build']

substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/mobius-os-dev/mobius-story-ui/story-ui:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
